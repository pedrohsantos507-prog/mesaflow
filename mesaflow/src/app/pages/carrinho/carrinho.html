
<h2>Meu Carrinho</h2>

@if (itens().length === 0) {
  <p>Seu carrinho está vazio.</p>
} @else {

  @for (produto of itens(); track $index) {

    <div class="item-carrinho">
      <h3>{{ produto.nome }}</h3>

      <p>{{ produto.preco | currency:'BRL' }}</p>

      <button (click)="removerProduto($index)">
        Remover
      </button>
    </div>

  }

  <h3>Total: {{ total() | currency:'BRL' }}</h3>

  <button (click)="limparCarrinho()">
    Limpar carrinho
  </button>
}
